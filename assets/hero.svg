<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="TalentFlow AI — Workforce Analytics and Retention Intelligence by ZubairLabs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06112A"/><stop offset=".55" stop-color="#0B1B3B"/><stop offset="1" stop-color="#1A1D4A"/>
    </linearGradient>
    <radialGradient id="glowE" cx=".08" cy=".05" r=".55"><stop offset="0" stop-color="#10B981" stop-opacity=".38"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowV" cx=".95" cy=".95" r=".6"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".42"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx=".78" cy=".1" r=".4"><stop offset="0" stop-color="#06B6D4" stop-opacity=".28"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset=".5" stop-color="#06B6D4"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="400" rx="26" fill="url(#glowE)"/>
  <rect width="1200" height="400" rx="26" fill="url(#glowC)"/>
  <rect width="1200" height="400" rx="26" fill="url(#glowV)"/>

  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="64" y="76" font-size="15" font-weight="700" letter-spacing="4" fill="#34D399">ZUBAIRLABS · PEOPLE ANALYTICS</text>
    <text x="62" y="152" font-size="66" font-weight="800" fill="#F8FAFC">Talent<tspan fill="url(#brand)">Flow</tspan> AI</text>
    <text x="64" y="196" font-size="25" font-weight="600" fill="#CBD5E1">Workforce Analytics &amp; Retention Intelligence</text>
    <text x="64" y="232" font-size="16.5" fill="#94A3B8">Aggregate insights · leakage-safe evaluation · privacy by design</text>
    <g font-size="13" font-weight="700">
      <rect x="64" y="262" width="176" height="32" rx="16" fill="#10B981" fill-opacity=".16" stroke="#10B981" stroke-opacity=".6"/>
      <text x="152" y="283" text-anchor="middle" fill="#A7F3D0">7 DASHBOARD MODULES</text>
      <rect x="252" y="262" width="196" height="32" rx="16" fill="#06B6D4" fill-opacity=".16" stroke="#06B6D4" stroke-opacity=".6"/>
      <text x="350" y="283" text-anchor="middle" fill="#A5F3FC">LOGISTIC REGRESSION</text>
      <rect x="460" y="262" width="168" height="32" rx="16" fill="#8B5CF6" fill-opacity=".2" stroke="#8B5CF6" stroke-opacity=".65"/>
      <text x="544" y="283" text-anchor="middle" fill="#DDD6FE">RESPONSIBLE AI</text>
    </g>
    <text x="64" y="346" font-size="14" fill="#FDE68A">◆ Synthetic demonstration data — not for individual employment decisions</text>
  </g>

  <!-- right: organisation network flowing into an aggregate dashboard card -->
  <g stroke="url(#brand)" stroke-width="2.2" fill="none" stroke-opacity=".75">
    <path d="M760 110 C 800 110, 800 80, 840 80"/><path d="M760 110 C 800 110, 800 140, 840 140"/>
    <path d="M760 200 C 800 200, 800 180, 840 180"/><path d="M760 200 C 800 200, 800 230, 840 230"/>
    <path d="M760 290 C 800 290, 800 270, 840 270"/><path d="M760 290 C 800 290, 800 320, 840 320"/>
    <path d="M700 200 C 720 200, 720 110, 760 110"/><path d="M700 200 L 760 200"/><path d="M700 200 C 720 200, 720 290, 760 290"/>
  </g>
  <g>
    <circle cx="688" cy="200" r="20" fill="url(#node)"/><circle cx="688" cy="193" r="6" fill="#0B1B3B"/><path d="M678 209c2-6 6-8 10-8s8 2 10 8" fill="#0B1B3B"/>
    <g fill="#0F2347" stroke="#06B6D4" stroke-width="2">
      <circle cx="760" cy="110" r="12"/><circle cx="760" cy="200" r="12"/><circle cx="760" cy="290" r="12"/>
    </g>
    <g fill="#10B981"><circle cx="846" cy="80" r="8"/><circle cx="846" cy="140" r="8"/><circle cx="846" cy="180" r="8"/></g>
    <g fill="#8B5CF6"><circle cx="846" cy="230" r="8"/><circle cx="846" cy="270" r="8"/></g>
    <circle cx="846" cy="320" r="8" fill="#F59E0B"/>
  </g>
  <g stroke="#94A3B8" stroke-opacity=".35" stroke-dasharray="4 5" stroke-width="1.6"><path d="M860 200 H 900"/></g>

  <g transform="translate(905,70)">
    <rect width="250" height="260" rx="18" fill="#0F2347" fill-opacity=".9" stroke="#94A3B8" stroke-opacity=".3"/>
    <text x="20" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#94A3B8">TURNOVER BY DEPT</text>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#CBD5E1">
      <text x="20" y="66">Ops</text><rect x="70" y="55" width="140" height="14" rx="7" fill="#F43F5E" fill-opacity=".85"/>
      <text x="20" y="94">Eng</text><rect x="70" y="83" width="118" height="14" rx="7" fill="#F59E0B" fill-opacity=".85"/>
      <text x="20" y="122">Sales</text><rect x="70" y="111" width="108" height="14" rx="7" fill="#06B6D4" fill-opacity=".85"/>
      <text x="20" y="150">Fin</text><rect x="70" y="139" width="86" height="14" rx="7" fill="#10B981" fill-opacity=".9"/>
    </g>
    <path d="M20 225 L 62 200 L 104 212 L 146 186 L 188 196 L 230 178" fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#F8FAFC"><circle cx="62" cy="200" r="3.5"/><circle cx="104" cy="212" r="3.5"/><circle cx="146" cy="186" r="3.5"/><circle cx="188" cy="196" r="3.5"/></g>
    <g transform="translate(196,14)">
      <path d="M17 2 L30 7 V17 C30 25 24 30 17 33 C10 30 4 25 4 17 V7 Z" fill="#8B5CF6" fill-opacity=".25" stroke="#A78BFA" stroke-width="1.8"/>
      <path d="M11 17 L15.5 21.5 L23 13" fill="none" stroke="#DDD6FE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="20" y="250" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">illustration · groups under 10 hidden</text>
  </g>
</svg>
